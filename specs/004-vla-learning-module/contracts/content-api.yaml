        "Learn to convert voice commands to structured inputs",
        "Implement OpenAI Whisper integration"
      ]
    },
    {
      "chapterId": "cognitive-planning",
      "title": "Cognitive Planning with LLMs",
      "order": 2,
      "estimatedTime": 180,
      "objectives": [
        "Translate natural language goals to ROS 2 actions",
        "Implement task decomposition logic",
