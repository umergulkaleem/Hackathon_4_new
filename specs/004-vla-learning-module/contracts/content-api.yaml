### GET /api/chapters/{chapterId}

**Description**: Retrieve content for a specific chapter

**Path Parameters**:
- `chapterId`: The ID of the chapter to retrieve

**Response**:
```json
{
  "chapterId": "voice-to-action",
  "title": "Voice-to-Action Interfaces",
  "content": "# Voice-to-Action Interfaces\n\nThis chapter covers...",
  "examples": [
    {
      "exampleId": "whisper-demo",
      "title": "OpenAI Whisper Speech Recognition",
      "description": "Demonstrates converting speech to text",
      "code": {
        "python": "import openai\n# Example code here",
        "explanation": "This code shows how to use Whisper API..."
      },
      "expectedOutput": "Transcribed text from audio input",
      "type": "voice",
      "difficulty": "intermediate"
    }
  ],
  "exercises": [
    {
      "exerciseId": "voice-command-parser",
      "title": "Voice Command Parser",
      "description": "Parse voice commands into structured actions",
      "instructions": "Implement a parser that converts voice commands...",
      "difficulty": "intermediate",
      "autoGraded": true
    }
  ],
  "moduleRef": "vla-learning-module",
  "order": 1,
  "estimatedTime": 120
}
```

### GET /api/examples/{exampleId}

**Description**: Retrieve details for a specific interactive example

**Path Parameters**:
- `exampleId`: The ID of the example to retrieve

**Response**:
```json
{
  "exampleId": "whisper-demo",
  "title": "OpenAI Whisper Speech Recognition",
  "description": "Demonstrates converting speech to text",
  "code": {
    "python": "import openai\n# Example code here",
    "explanation": "This code shows how to use Whisper API..."
  },
  "simulation": "audio-processing",
  "expectedOutput": "Transcribed text from audio input",
  "chapterRef": "voice-to-action",
  "type": "voice",
  "difficulty": "intermediate",
  "interactive": true,
  "dependencies": [
    "openai",
    "whisper"
  ]
}
```

### GET /api/simulations/{envId}

**Description**: Retrieve configuration for a simulation environment

**Path Parameters**:
- `envId`: The ID of the simulation environment to retrieve

**Response**:
```json
{
  "envId": "ros2-humanoid-sim",
  "name": "ROS 2 Humanoid Robot Simulation",
  "description": "Simulation environment for humanoid robots with ROS 2",
  "robotType": "humanoid",
  "capabilities": [
    "navigation",
    "manipulation",
    "speech_recognition",
    "object_detection"
  ],
  "dockerImage": "ros2/humble:humble-ros-base",
  "configFile": "/config/humanoid-sim.yaml",
  "examples": [
    "whisper-demo",
    "object-recognition",
    "path-planning"
  ],
  "setupInstructions": "docker-compose up -d humanoid-sim"
}
```

## Content Structure

### Markdown Content Format

All chapter content follows this structure:

```markdown
---
title: Chapter Title
description: Brief description of the chapter
learningObjectives:
  - Objective 1
  - Objective 2
prerequisites:
  - Prerequisite 1
  - Prerequisite 2
estimatedTime: 120
difficulty: intermediate
---

# Chapter Title

## Section 1

Content goes here...

## Interactive Example

```jsx
<ExampleComponent id="example-id" />
```

## Exercises

<ExerciseComponent id="exercise-id" />
```

### Example Component Interface

```typescript
interface ExampleProps {
  id: string;
  title?: string;
  showCode?: boolean;
  showOutput?: boolean;
  initialCode?: string;
}
```

## Error Handling

- 404: Resource not found (invalid module, chapter, or example ID)
- 422: Unprocessable entity (malformed request)
- 500: Internal server error

## Security

- No authentication required for educational content
- Content is read-only and static
- No user data collection through these endpoints

## Versioning

- API version is specified in the contract version
- Backward compatibility maintained for content structure
- Breaking changes require new version of the contract