# Content API Contract: VLA Learning Module

**Feature**: VLA Learning Module
**Version**: 1.0.0
**Created**: 2025-12-17

## Overview

This contract defines the structure and access patterns for VLA learning module content within the Docusaurus-based educational platform. The API is primarily conceptual, as the content will be statically generated by Docusaurus, but it defines the data structures and access patterns.

## Endpoints

### GET /api/modules/vla

**Description**: Retrieve the VLA learning module metadata

**Response**:
```json
